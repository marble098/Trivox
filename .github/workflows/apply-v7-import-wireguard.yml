name: Apply Trivox v7 import and WireGuard fixes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/apply-v7-import-wireguard.py
      - tools/install-trivox-v7-termux.sh
      - .github/workflows/apply-v7-import-wireguard.yml

permissions:
  contents: write

concurrency:
  group: trivox-v7-import-wireguard-main
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply guarded v7 patch
        run: |
          python3 tools/apply-v7-import-wireguard.py
          python3 tools/apply-v7-import-wireguard.py --check

      - name: Validate scripts and resources
        run: |
          python3 -m py_compile tools/apply-v7-import-wireguard.py
          bash -n tools/install-trivox-v7-termux.sh
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = sorted(Path('app/src/main/res').rglob('*.xml'))
          for path in files:
              ET.parse(path)
          print(f'Validated {len(files)} XML resources')
          PY
          git diff --check

      - name: Run repository audit
        run: python3 tools/audit-trivox.py --ci

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Commit and push verified source changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trivox-reliability-bot"
          git config user.email "trivox-reliability-bot@users.noreply.github.com"
          git add \
            README.md \
            app/src/main/java/com/trivox/client/config/ConfigParser.kt \
            app/src/main/java/com/trivox/client/config/XrayConfigBuilder.kt \
            app/src/main/java/com/trivox/client/core/CoreManager.kt \
            app/src/main/java/com/trivox/client/data/Repositories.kt \
            app/src/main/java/com/trivox/client/ui/MainActivity.kt \
            app/src/main/java/com/trivox/client/ui/SettingsActivity.kt \
            app/src/main/java/com/trivox/client/ui/ThemedActivity.kt \
            app/src/main/res/values/strings_v7.xml \
            app/src/main/res/values-fa/strings_v7.xml \
            app/src/test/java/com/trivox/client/config/ConfigParserWireGuardQuickV7Test.kt \
            app/src/test/java/com/trivox/client/config/XrayConfigBuilderWireGuardV7Test.kt

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Trivox v7 was already applied."
            exit 0
          fi

          git commit -m "Fix selected-sub imports and harden WireGuard compatibility"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Trivox v7 rollout"
            echo
            echo "- Guarded patch: completed"
            echo "- Android XML: validated"
            echo "- Repository audit: completed"
            echo "- Unit tests: completed"
            echo "- Source commit created: ${{ steps.commit.outputs.changed || 'unknown' }}"
            if [[ -n "${{ steps.commit.outputs.commit }}" ]]; then
              echo "- Commit: \`${{ steps.commit.outputs.commit }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
