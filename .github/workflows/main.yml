name: Build Trivox APKs

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:

  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: all
        type: choice
        options:
          - debug
          - release
          - all

      core_version:
        description: Pinned Xray/libXray version
        required: true
        default: v26.7.28
        type: string

      use_latest_stable:
        description: Replace pinned version with latest stable
        required: false
        default: false
        type: boolean

      use_latest_prerelease:
        description: Use latest compatible prerelease
        required: false
        default: false
        type: boolean

      requested_abis:
        description: Comma-separated ABIs
        required: true
        default: arm64-v8a,armeabi-v7a,x86_64
        type: string

      create_release:
        description: Publish APKs to a GitHub Release
        required: false
        default: false
        type: boolean

      release_tag:
        description: Release tag
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: trivox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"
  GRADLE_DISTRIBUTION_SHA256: "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78"
  DEFAULT_CORE_VERSION: "v26.7.28"
  DEFAULT_ABIS: "arm64-v8a,armeabi-v7a,x86_64"

jobs:
  validate:
    name: Project validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fix file permissions
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          chmod +x build.sh

          if [[ -d tools ]]; then
            find tools -maxdepth 1 -type f -name "*.sh" -exec chmod +x {} +
          fi

      - name: Fix Gradle wrapper checksum
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER_FILE="gradle/wrapper/gradle-wrapper.properties"

          if [[ ! -f "$WRAPPER_FILE" ]]; then
            echo "Missing file: $WRAPPER_FILE" >&2
            exit 1
          fi

          sed -i \
            "s|^distributionSha256Sum=.*|distributionSha256Sum=${GRADLE_DISTRIBUTION_SHA256}|" \
            "$WRAPPER_FILE"

          if ! grep -q '^distributionSha256Sum=' "$WRAPPER_FILE"; then
            printf '\ndistributionSha256Sum=%s\n' \
              "$GRADLE_DISTRIBUTION_SHA256" >> "$WRAPPER_FILE"
          fi

          echo "Gradle wrapper configuration:"
          grep -E '^distributionUrl=|^distributionSha256Sum=' "$WRAPPER_FILE"

          CONFIGURED_SHA="$(
            sed -n 's/^distributionSha256Sum=//p' "$WRAPPER_FILE" |
            tr -d '\r'
          )"

          if [[ "$CONFIGURED_SHA" != "$GRADLE_DISTRIBUTION_SHA256" ]]; then
            echo "Gradle checksum could not be corrected." >&2
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Validate scripts
        shell: bash
        run: |
          set -euo pipefail

          bash -n tools/trivox-wizard.sh
          bash -n tools/prepare-core.sh
          bash -n build.sh
          python3 -m py_compile tools/generate-core-manifest.py

      - name: Run tests and lint
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            test \
            lint

  prepare-core:
    name: Prepare official Android core
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fix file permissions
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          chmod +x build.sh

          if [[ -d tools ]]; then
            find tools -maxdepth 1 -type f -name "*.sh" -exec chmod +x {} +
          fi

      - name: Fix Gradle wrapper checksum
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER_FILE="gradle/wrapper/gradle-wrapper.properties"

          if [[ ! -f "$WRAPPER_FILE" ]]; then
            echo "Missing file: $WRAPPER_FILE" >&2
            exit 1
          fi

          sed -i \
            "s|^distributionSha256Sum=.*|distributionSha256Sum=${GRADLE_DISTRIBUTION_SHA256}|" \
            "$WRAPPER_FILE"

          if ! grep -q '^distributionSha256Sum=' "$WRAPPER_FILE"; then
            printf '\ndistributionSha256Sum=%s\n' \
              "$GRADLE_DISTRIBUTION_SHA256" >> "$WRAPPER_FILE"
          fi

      - name: Select core inputs
        id: core
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.core_version }}
          INPUT_ABIS: ${{ inputs.requested_abis }}
          LATEST_STABLE: ${{ inputs.use_latest_stable }}
          LATEST_PRERELEASE: ${{ inputs.use_latest_prerelease }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION:-$DEFAULT_CORE_VERSION}"
          abis="${INPUT_ABIS:-$DEFAULT_ABIS}"
          latest_stable="${LATEST_STABLE:-false}"
          latest_prerelease="${LATEST_PRERELEASE:-false}"

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid core version: $version" >&2
            exit 2
          fi

          if [[ ! "$abis" =~ ^(arm64-v8a|armeabi-v7a|x86_64)(,(arm64-v8a|armeabi-v7a|x86_64))*$ ]]; then
            echo "Invalid ABI input: $abis" >&2
            exit 2
          fi

          if [[ "$latest_stable" == "true" && "$latest_prerelease" == "true" ]]; then
            echo "Select only one latest-version option." >&2
            exit 2
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'abis=%s\n' "$abis" >> "$GITHUB_OUTPUT"
          printf 'latest_stable=%s\n' "$latest_stable" >> "$GITHUB_OUTPUT"
          printf 'latest_prerelease=%s\n' "$latest_prerelease" >> "$GITHUB_OUTPUT"

      - name: Download and verify official libXray
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORE_VERSION: ${{ steps.core.outputs.version }}
          REQUESTED_ABIS: ${{ steps.core.outputs.abis }}
          LATEST_STABLE: ${{ steps.core.outputs.latest_stable }}
          LATEST_PRERELEASE: ${{ steps.core.outputs.latest_prerelease }}
        run: |
          set -euo pipefail

          mode=(--core-version "$CORE_VERSION")

          if [[ "$LATEST_STABLE" == "true" ]]; then
            mode=(--latest-stable)
          elif [[ "$LATEST_PRERELEASE" == "true" ]]; then
            mode=(--latest-prerelease)
          fi

          bash tools/trivox-wizard.sh \
            "${mode[@]}" \
            --abis "$REQUESTED_ABIS" \
            --prepare-only \
            --non-interactive

      - name: Verify prepared core
        shell: bash
        run: |
          set -euo pipefail

          test -s app/libs/libXray.aar
          test -s app/src/main/assets/core-manifest.json
          test -s gradle.properties

          echo "Official Android core prepared successfully."
          ls -lh app/libs/libXray.aar
          ls -lh app/src/main/assets/core-manifest.json

      - name: Upload prepared core
        uses: actions/upload-artifact@v4
        with:
          name: prepared-core
          path: |
            app/libs/libXray.aar
            app/src/main/assets/core-manifest.json
            gradle.properties
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  build:
    name: Build and collect APKs
    runs-on: ubuntu-latest
    needs: prepare-core
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fix file permissions
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          chmod +x build.sh

          if [[ -d tools ]]; then
            find tools -maxdepth 1 -type f -name "*.sh" -exec chmod +x {} +
          fi

      - name: Fix Gradle wrapper checksum
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER_FILE="gradle/wrapper/gradle-wrapper.properties"

          if [[ ! -f "$WRAPPER_FILE" ]]; then
            echo "Missing file: $WRAPPER_FILE" >&2
            exit 1
          fi

          sed -i \
            "s|^distributionSha256Sum=.*|distributionSha256Sum=${GRADLE_DISTRIBUTION_SHA256}|" \
            "$WRAPPER_FILE"

          if ! grep -q '^distributionSha256Sum=' "$WRAPPER_FILE"; then
            printf '\ndistributionSha256Sum=%s\n' \
              "$GRADLE_DISTRIBUTION_SHA256" >> "$WRAPPER_FILE"
          fi

          CONFIGURED_SHA="$(
            sed -n 's/^distributionSha256Sum=//p' "$WRAPPER_FILE" |
            tr -d '\r'
          )"

          if [[ "$CONFIGURED_SHA" != "$GRADLE_DISTRIBUTION_SHA256" ]]; then
            echo "Gradle checksum could not be corrected." >&2
            exit 1
          fi

      - name: Download prepared core
        uses: actions/download-artifact@v4
        with:
          name: prepared-core
          path: .

      - name: Verify downloaded core
        shell: bash
        run: |
          set -euo pipefail

          test -s app/libs/libXray.aar
          test -s app/src/main/assets/core-manifest.json
          test -s gradle.properties

          echo "Prepared core downloaded successfully."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Configure optional release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$KEYSTORE_B64" &&
                -n "$KEYSTORE_PASSWORD" &&
                -n "$KEY_ALIAS" &&
                -n "$KEY_PASSWORD" ]]; then

            umask 077

            printf '%s' "$KEYSTORE_B64" |
              base64 --decode > "$RUNNER_TEMP/trivox-release.jks"

            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/trivox-release.jks"
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > signing.properties

            echo "Release signing configured."
          else
            echo "Signing secrets are not configured."
            echo "Release APK will use the installable debug key."
          fi

      - name: Build selected variants
        shell: bash
        env:
          REQUESTED_BUILD: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          bash build.sh "${REQUESTED_BUILD:-all}"

      - name: Verify generated APKs
        shell: bash
        run: |
          set -euo pipefail

          if ! compgen -G "dist/*.apk" > /dev/null; then
            echo "No APK files were generated in the dist directory." >&2
            exit 1
          fi

          echo "Generated APK files:"
          ls -lh dist/*.apk

          if [[ ! -s dist/SHA256SUMS.txt ]]; then
            (
              cd dist
              sha256sum ./*.apk > SHA256SUMS.txt
            )
          fi

          echo "APK checksums:"
          cat dist/SHA256SUMS.txt

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f -- signing.properties
          rm -f -- "$RUNNER_TEMP/trivox-release.jks"

      - name: Upload generated APKs
        uses: actions/upload-artifact@v4
        with:
          name: trivox-apks-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Optional GitHub Release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.create_release &&
      inputs.release_tag != ''
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Download generated APKs
        uses: actions/download-artifact@v4
        with:
          name: trivox-apks-${{ github.run_number }}
          path: dist

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail

          if ! compgen -G "dist/*.apk" > /dev/null; then
            echo "No APK files are available for release." >&2
            exit 1
          fi

          ls -lh dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            dist/*.apk \
            dist/SHA256SUMS.txt \
            --title "Trivox $RELEASE_TAG" \
            --generate-notes
