name: Build Trivox APKs

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: all
        type: choice
        options: [debug, release, all]
      core_version:
        description: Pinned Xray/libXray version
        required: true
        default: v26.7.28
        type: string
      use_latest_stable:
        description: Replace pinned version with latest stable
        required: false
        default: false
        type: boolean
      use_latest_prerelease:
        description: Use latest compatible prerelease
        required: false
        default: false
        type: boolean
      requested_abis:
        description: Comma-separated ABIs
        required: true
        default: arm64-v8a,armeabi-v7a,x86_64
        type: string
      release_tag:
        description: Optional custom release tag; blank uses the automatic app version
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: trivox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_DISTRIBUTION_SHA256: "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78"
  DEFAULT_CORE_VERSION: "v26.7.28"
  DEFAULT_ABIS: "arm64-v8a,armeabi-v7a,x86_64"

jobs:
  validate:
    name: Project validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute automatic app version
        shell: bash
        run: |
          set -euo pipefail
          commit_count="$(git rev-list --count HEAD)"
          version_code="$((1000 + commit_count))"
          version_name="0.2.${commit_count}"
          short_sha="$(git rev-parse --short=8 HEAD)"

          echo "TRIVOX_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "TRIVOX_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "TRIVOX_GIT_SHA=$short_sha" >> "$GITHUB_ENV"

          {
            echo "### Trivox automatic version"
            echo
            echo "- Version name: \`$version_name\`"
            echo "- Version code: \`$version_code\`"
            echo "- Commit: \`$short_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew build.sh
          find tools -maxdepth 1 -type f -name "*.sh" -exec chmod +x {} +

          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties

          grep -Fqx \
            "distributionSha256Sum=${GRADLE_DISTRIBUTION_SHA256}" \
            gradle/wrapper/gradle-wrapper.properties

          bash -n \
            build.sh \
            tools/trivox-wizard.sh \
            tools/prepare-core.sh

          python3 -m py_compile tools/generate-core-manifest.py

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Run unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace test lint

  build:
    name: Build direct-download APKs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute automatic app version
        shell: bash
        run: |
          set -euo pipefail
          commit_count="$(git rev-list --count HEAD)"
          version_code="$((1000 + commit_count))"
          version_name="0.2.${commit_count}"
          short_sha="$(git rev-parse --short=8 HEAD)"

          echo "TRIVOX_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "TRIVOX_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "TRIVOX_GIT_SHA=$short_sha" >> "$GITHUB_ENV"

      - name: Fix script permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew build.sh
          find tools -maxdepth 1 -type f -name "*.sh" -exec chmod +x {} +

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Select core inputs
        id: core
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.core_version }}
          INPUT_ABIS: ${{ inputs.requested_abis }}
          LATEST_STABLE: ${{ inputs.use_latest_stable }}
          LATEST_PRERELEASE: ${{ inputs.use_latest_prerelease }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION:-$DEFAULT_CORE_VERSION}"
          abis="${INPUT_ABIS:-$DEFAULT_ABIS}"
          latest_stable="${LATEST_STABLE:-false}"
          latest_prerelease="${LATEST_PRERELEASE:-false}"

          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
            echo "Invalid core version: $version" >&2
            exit 2
          }

          [[ "$abis" =~ ^(arm64-v8a|armeabi-v7a|x86_64)(,(arm64-v8a|armeabi-v7a|x86_64))*$ ]] || {
            echo "Invalid ABI input: $abis" >&2
            exit 2
          }

          if [[ "$latest_stable" == "true" && "$latest_prerelease" == "true" ]]; then
            echo "Select only one latest-version option." >&2
            exit 2
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'abis=%s\n' "$abis" >> "$GITHUB_OUTPUT"
          printf 'latest_stable=%s\n' "$latest_stable" >> "$GITHUB_OUTPUT"
          printf 'latest_prerelease=%s\n' "$latest_prerelease" >> "$GITHUB_OUTPUT"

      - name: Download and verify official libXray
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORE_VERSION: ${{ steps.core.outputs.version }}
          REQUESTED_ABIS: ${{ steps.core.outputs.abis }}
          LATEST_STABLE: ${{ steps.core.outputs.latest_stable }}
          LATEST_PRERELEASE: ${{ steps.core.outputs.latest_prerelease }}
        run: |
          set -euo pipefail

          mode=(--core-version "$CORE_VERSION")

          if [[ "$LATEST_STABLE" == "true" ]]; then
            mode=(--latest-stable)
          elif [[ "$LATEST_PRERELEASE" == "true" ]]; then
            mode=(--latest-prerelease)
          fi

          bash tools/trivox-wizard.sh \
            "${mode[@]}" \
            --abis "$REQUESTED_ABIS" \
            --prepare-only \
            --non-interactive

          test -s app/libs/libXray.aar
          test -s app/src/main/assets/core-manifest.json
          test -s gradle.properties

      - name: Configure persistent APK signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail

          for value in             "$KEYSTORE_B64"             "$KEYSTORE_PASSWORD"             "$KEY_ALIAS"             "$KEY_PASSWORD"             "$EXPECTED_CERT_SHA256"; do
            [[ -n "$value" ]] || {
              echo "Persistent signing secrets are incomplete." >&2
              exit 1
            }
          done

          umask 077
          printf '%s' "$KEYSTORE_B64" |
            base64 --decode > "$RUNNER_TEMP/trivox-release.jks"

          keytool -list             -keystore "$RUNNER_TEMP/trivox-release.jks"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" > /dev/null

          {
            printf 'storeFile=%s
' "$RUNNER_TEMP/trivox-release.jks"
            printf 'storePassword=%s
' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s
' "$KEY_ALIAS"
            printf 'keyPassword=%s
' "$KEY_PASSWORD"
          } > signing.properties

      - name: Build selected variants
        shell: bash
        env:
          REQUESTED_BUILD: ${{ inputs.build_type }}
          TRIVOX_ABIS: ${{ steps.core.outputs.abis }}
        run: |
          set -euo pipefail

          bash build.sh "${REQUESTED_BUILD:-all}"

          compgen -G "dist/*.apk" > /dev/null || {
            echo "No APK files were generated." >&2
            exit 1
          }

          test -s dist/SHA256SUMS.txt

          cat > dist/VERSION.txt <<VERSION
          versionName=${TRIVOX_VERSION_NAME}
          versionCode=${TRIVOX_VERSION_CODE}
          gitSha=${TRIVOX_GIT_SHA}
          coreVersion=${{ steps.core.outputs.version }}
          VERSION

          ls -lh dist/*.apk
          cat dist/SHA256SUMS.txt
          cat dist/VERSION.txt

      - name: Verify stable APK certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail

          apksigner="$(
            find "$ANDROID_HOME/build-tools"               -type f -name apksigner |
              sort -V |
              tail -n 1
          )"
          [[ -x "$apksigner" ]] || {
            echo "apksigner was not found." >&2
            exit 1
          }

          expected="$(
            printf '%s' "$EXPECTED_CERT_SHA256" |
              tr -d ':[:space:]' |
              tr '[:lower:]' '[:upper:]'
          )"

          first=""
          for apk in dist/*.apk; do
            "$apksigner" verify --verbose "$apk"
            actual="$(
              "$apksigner" verify --print-certs "$apk" |
                sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
                head -n 1 |
                tr -d ':[:space:]' |
                tr '[:lower:]' '[:upper:]'
            )"
            [[ "$actual" == "$expected" ]] || {
              echo "Unexpected certificate for $apk" >&2
              echo "Expected: $expected" >&2
              echo "Actual:   $actual" >&2
              exit 1
            }
            if [[ -z "$first" ]]; then
              first="$actual"
            elif [[ "$first" != "$actual" ]]; then
              echo "APK signatures are inconsistent." >&2
              exit 1
            fi
          done

          printf '%s\n' "$first" > dist/SIGNING_CERT_SHA256.txt

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f -- \
            signing.properties \
            "$RUNNER_TEMP/trivox-release.jks"

      - name: Publish APK files for direct download
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_RELEASE_TAG" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="v${TRIVOX_VERSION_NAME}"
          fi

          release_title="Trivox ${TRIVOX_VERSION_NAME} (${TRIVOX_GIT_SHA})"

          if gh release view "$release_tag" > /dev/null 2>&1; then
            gh release upload \
              "$release_tag" \
              dist/*.apk \
              dist/SHA256SUMS.txt \
              dist/VERSION.txt \
              dist/SIGNING_CERT_SHA256.txt \
              --clobber
          else
            gh release create \
              "$release_tag" \
              dist/*.apk \
              dist/SHA256SUMS.txt \
              dist/VERSION.txt \
              dist/SIGNING_CERT_SHA256.txt \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --generate-notes \
              --prerelease
          fi

          {
            echo "### Direct APK downloads"
            echo
            echo "Version: \`${TRIVOX_VERSION_NAME}\` (code \`${TRIVOX_VERSION_CODE}\`)"
            echo

            for apk in dist/*.apk; do
              name=$(basename -- "$apk")
              echo "- [$name](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${name})"
            done

            echo "- [SHA256SUMS.txt](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${release_tag}/SHA256SUMS.txt)"
            echo "- [VERSION.txt](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${release_tag}/VERSION.txt)"
            echo "- [SIGNING_CERT_SHA256.txt](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${release_tag}/SIGNING_CERT_SHA256.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain pull request output policy
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          {
            echo "### APK build passed"
            echo
            echo "APK publishing is intentionally disabled for pull requests."
            echo "Run this workflow manually or push to main/master to publish direct APK files in Releases."
          } >> "$GITHUB_STEP_SUMMARY"
