name: Apply Trivox v6.1 reliability fixes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/apply-v6-reliability.py
      - tools/install-trivox-v6-termux.sh
      - .github/workflows/apply-v6-reliability.yml

permissions:
  contents: write

concurrency:
  group: trivox-v6-1-reliability-main
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded v6 patch
        run: |
          python3 tools/apply-v6-reliability.py
          python3 tools/apply-v6-reliability.py --check

      - name: Validate Android XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = sorted(Path('app/src/main/res').rglob('*.xml'))
          for path in files:
              ET.parse(path)
          print(f'Validated {len(files)} XML resources')
          PY

      - name: Run Trivox audit
        run: python3 tools/audit-trivox.py --ci

      - name: Check patch hygiene
        run: |
          git diff --check
          python3 -m py_compile tools/apply-v6-reliability.py
          bash -n tools/install-trivox-v6-termux.sh

      - name: Commit and push source changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trivox-reliability-bot"
          git config user.email "trivox-reliability-bot@users.noreply.github.com"
          git add README.md app/src/main app/src/test tools/apply-v6-reliability.py tools/install-trivox-v6-termux.sh .github/workflows/apply-v6-reliability.yml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Trivox v6 was already applied."
            exit 0
          fi
          git commit -m "Fix connection cancellation and subscription-scoped latency"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Trivox v6.1 reliability rollout"
            echo
            echo "- Patch verification: completed"
            echo "- XML validation: completed"
            echo "- Repository audit: completed"
            echo "- Source commit created: ${{ steps.commit.outputs.changed || 'unknown' }}"
            if [[ -n "${{ steps.commit.outputs.commit }}" ]]; then
              echo "- Commit: \`${{ steps.commit.outputs.commit }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
