name: Trivox multicore binaries

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: trivox-multicore-main
  cancel-in-progress: false

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source multicore patch
        run: python3 tools/patch-trivox-multicore.py

      - name: Fix quick core button code
        run: python3 tools/fix-quick-core-button.py

      - name: Verify quick core button cleanup
        run: |
          python3 tools/fix-quick-core-button.py
          ! grep -n "[^.]quickCoreButton" app/src/main/java/com/trivox/client/ui/MainActivity.kt

      - name: Verify quick core layout id
        run: |
          grep -n '@+id/quickCoreButton' app/src/main/res/layout/activity_main.xml

      - name: Reapply deep debug normalization
        run: python3 tools/apply-deep-debug-fix.py

      - name: Apply native subscriptions and smart core fix
        run: python3 tools/apply-native-subscription-smartcore-fix.py "$GITHUB_WORKSPACE"

      - name: Verify native subscriptions and smart core
        run: python3 tools/trivox-native-smart-doctor.py "$GITHUB_WORKSPACE"

      - name: Run Trivox static doctor
        run: python3 tools/trivox_repo_doctor.py

      - name: Download latest prerelease sing-box and mihomo assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIVOX_MULTICORE_ABIS: arm64-v8a,armeabi-v7a
        run: python3 tools/prepare-multicore-binaries.py

      - name: Fix native core packaging
        run: python3 tools/fix-native-core-packaging.py

      - name: Verify native core libs
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libtrivox_sing_box.so
          test -f app/src/main/jniLibs/arm64-v8a/libtrivox_mihomo.so
          test -f app/src/main/jniLibs/armeabi-v7a/libtrivox_sing_box.so
          test -f app/src/main/jniLibs/armeabi-v7a/libtrivox_mihomo.so
          ls -lh app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a

      - name: Commit prepared multicore files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main tools docs .github/workflows app/build.gradle.kts app/build.gradle.kts app/build.gradle.kts app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "No multicore changes to commit"
          else
            git commit -m "Add sing-box and mihomo multicore binaries"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              echo "Push failed on attempt ${attempt}; retrying"
              sleep $((attempt * 3))
            done
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin early
        run: |
          chmod +x ./gradlew || true
          ./gradlew :app:compileReleaseKotlin -PtrivoxAbis=arm64-v8a,armeabi-v7a --stacktrace

      - name: Build release APKs
        run: |
          chmod +x ./gradlew || true
          ./gradlew clean :app:assembleRelease -PtrivoxAbis=arm64-v8a,armeabi-v7a --no-build-cache --stacktrace

      - name: Verify APK size under 240 MB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          limit = 240 * 1024 * 1024
          apks = list(Path('app/build/outputs/apk').rglob('*.apk'))
          if not apks:
              raise SystemExit('no APKs found')
          bad = []
          for apk in apks:
              size = apk.stat().st_size
              print(f'{apk}: {size/1024/1024:.1f} MB')
              if size > limit:
                  bad.append(apk)
          if bad:
              raise SystemExit('APK over 240 MB: ' + ', '.join(map(str, bad)))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivox-multicore-apks-and-logs
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/**
            app/src/main/assets/core-manifest-multicore.json
